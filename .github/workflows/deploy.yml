name: CI — Build & Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # ANTHROPIC_API_KEY is not required at build time — the API route is dynamic
          # and only instantiates the client on request. Set this in Vercel for runtime.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
